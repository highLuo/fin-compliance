name: compliance-scan

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: self-test
        run: python fin_compliance.py --self-test
      - name: scan compliant samples (must be clean)
        run: python fin_compliance.py samples/clean/ --format json --fail-on high
